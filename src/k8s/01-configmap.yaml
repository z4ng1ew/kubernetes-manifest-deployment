ConfigMap `app-config` — централизованное хранилище несекретных настроек: хосты и порты Postgres, RabbitMQ и сервисов. Хосты — это имена Service-объектов, которые резолвятся через внутренний DNS Kubernetes. Конфигурация отделена от кода — пересобирать образы не нужно.

