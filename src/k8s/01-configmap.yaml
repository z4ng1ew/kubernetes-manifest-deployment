# ConfigMap — несекретные настройки.
# Хосты внутри Kubernetes — это имена Service-объектов (внутренний DNS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # PostgreSQL
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

  # RabbitMQ
  RABBIT_MQ_HOST: rabbitmq
  RABBIT_MQ_PORT: "5672"
  RABBIT_MQ_QUEUE_NAME: booking_statistics_queue
  RABBIT_MQ_EXCHANGE: booking_statistics_exchange

  # Хосты сервисов = имена Service-объектов
  SESSION_SERVICE_HOST: session-service
  SESSION_SERVICE_PORT: "8081"
  HOTEL_SERVICE_HOST: hotel-service
  HOTEL_SERVICE_PORT: "8082"
  BOOKING_SERVICE_HOST: booking-service
  BOOKING_SERVICE_PORT: "8083"
  PAYMENT_SERVICE_HOST: payment-service
  PAYMENT_SERVICE_PORT: "8084"
  LOYALTY_SERVICE_HOST: loyalty-service
  LOYALTY_SERVICE_PORT: "8085"
  REPORT_SERVICE_HOST: report-service
  REPORT_SERVICE_PORT: "8086"









# Монолог для защиты (≈300 символов)

---

Это ConfigMap `app-config` — централизованное хранилище несекретных настроек: хосты и порты Postgres, RabbitMQ и всех семи сервисов. Хосты — это имена Kubernetes-сервисов, которые резолвятся через внутренний DNS кластера. Такой подход отделяет конфигурацию от кода: при изменении хоста не нужно пересобирать образы — достаточно обновить ConfigMap.

---

**Длина: ~390 символов.** Если нужно строго 300:

