# session-service: авторизация/регистрация.
# NodePort — выставляется наружу для прокидывания туннеля (пункт 6 задания).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  labels:
    app: session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
        - name: session-service
          image: src-session-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: users_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  labels:
    app: session-service
spec:
  selector:
    app: session-service
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort












# Монолог для защиты (≈300 символов)

---

Это session-service — сервис авторизации и регистрации пользователей, работает с БД `users_db`. Тип Service — NodePort, потому что по заданию нужно прокинуть туннель снаружи кластера для тестов Postman. Хосты и порты берутся из ConfigMap, креды БД — из Secret. Контейнер слушает порт 8081 внутри пода.

