## 🔑 Ключевые моменты для защиты

### 🌐 Почему именно NodePort

Сервисов в Kubernetes есть несколько типов:

| Тип | Доступ | Когда использовать |
|-----|--------|-------------------|
| `ClusterIP` (по умолчанию) | Только внутри кластера | Для внутренних сервисов (БД, межсервисное общение) |
| **`NodePort` (этот)** | Снаружи через IP ноды + порт | Для тестов / dev — открыть наружу без облака |
| `LoadBalancer` | Через облачный балансировщик | Production в AWS/GCP/Azure |

По заданию (пункт 6) нужно **прокинуть туннели для gateway-service и session-service** — поэтому именно у них тип `NodePort`. У остальных сервисов (booking, hotel, payment, loyalty, report, postgres, rabbitmq) — `ClusterIP`, потому что их вызывает только gateway внутри кластера.

---

### 🚪 Как работает NodePort

Когда ставишь `type: NodePort`, Kubernetes автоматически выделяет случайный порт из диапазона **30000–32767** на каждой ноде кластера:

```
Снаружи              IP ноды:32562 ──► Service:8081 ──► Pod:8081
(твоя машина)        (NodePort)        (port)          (targetPort)
```

В твоём `kubectl get svc` это видно:
```
session-service   NodePort   10.100.177.26   <none>   8081:32562/TCP
```

Здесь `32562` — это и есть случайный NodePort. Чтобы открыть туннель:
```bash
minikube service session-service
```

minikube откроет браузер по URL `http://127.0.0.1:XXXXX`, где XXXXX — туннельный порт.

---

### 🗄️ Почему именно `users_db`

В образе `src-postgres:latest` встроен `init.sql`, который при первом запуске создаёт 6 баз — по одной на каждый сервис. Для session-service выделена `users_db` (логины, пароли, токены). Это паттерн **database per service** — у каждого микросервиса своя БД, никто не лезет в чужие таблицы напрямую.

---

### 🔄 Что делает session-service в архитектуре

```
Postman ──► gateway-service ──► session-service ──► users_db (PostgreSQL)
              (8087)                (8081)              (5432)
```

Сервис:
- регистрирует пользователей
- проверяет логин/пароль
- выдаёт токены сессии
- проверяет валидность токенов при последующих запросах

Поэтому он критически важен — без него остальные сервисы не пропустят запросы.