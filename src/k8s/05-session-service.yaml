# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                              # Версия API для Deployment'ов (стабильная)
kind: Deployment                                 # Тип объекта — Deployment (управляет подом session-service)
metadata:                                        # Блок метаданных Deployment'а
  name: session-service                          # Имя Deployment'а — также DNS-имя для других сервисов внутри кластера
  labels:                                        # Метки Deployment'а
    app: session-service                         # Метка для идентификации
spec:                                            # Спецификация Deployment'а
  replicas: 1                                    # Одна реплика — по заданию для всех сервисов одна
  selector:                                      # Селектор — какие поды считать "своими"
    matchLabels:                                 # Точное совпадение меток
      app: session-service                       # Управлять подами с меткой app=session-service
  template:                                      # Шаблон создаваемых подов
    metadata:                                    # Метаданные пода
      labels:                                    # Метки пода
        app: session-service                     # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                        # Спецификация пода
      containers:                                # Список контейнеров в поде (один)
        - name: session-service                  # Имя контейнера
          image: src-session-service:latest      # Локальный Docker-образ сервиса авторизации
          imagePullPolicy: Never                 # Не качать из реестра — использовать локальный образ minikube
          ports:                                 # Порты, которые слушает контейнер
            - containerPort: 8081                # Порт сервиса (Spring Boot слушает 8081)
          env:                                   # Переменные окружения для контейнера
            - name: POSTGRES_HOST                # Хост БД
              valueFrom:                         # Значение из внешнего источника
                configMapKeyRef:                 # Источник — ConfigMap
                  name: app-config               # Имя ConfigMap'а
                  key: POSTGRES_HOST             # Ключ → "postgres" (DNS-имя БД)
            - name: POSTGRES_PORT                # Порт БД
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT             # Ключ → "5432"
            - name: POSTGRES_DB                  # Имя конкретной БД для этого сервиса
              value: users_db                    # Хардкод — БД пользователей (создана через init.sql в postgres-образе)
            - name: POSTGRES_USER                # Логин БД
              valueFrom:
                secretKeyRef:                    # Источник — Secret (чувствительные данные)
                  name: app-secrets
                  key: POSTGRES_USER             # Ключ с логином в base64
            - name: POSTGRES_PASSWORD            # Пароль БД
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD         # Пароль в base64
---                                              # Разделитель YAML-документов
apiVersion: v1                                   # Версия API для Service (core API → v1)
kind: Service                                    # Тип объекта — Service
metadata:                                        # Метаданные Service'а
  name: session-service                          # Имя Service'а = DNS-имя в кластере
  labels:                                        # Метки Service'а
    app: session-service                         # Метка для группировки
spec:                                            # Спецификация Service'а
  selector:                                      # Селектор — какие поды обслуживает
    app: session-service                         # Все поды с меткой app=session-service
  ports:                                         # Порты Service'а
    - port: 8081                                 # Порт самого Service'а (внутри кластера)
      targetPort: 8081                           # Порт контейнера, куда направляется трафик
  type: NodePort                                 # NodePort — Service доступен СНАРУЖИ через IP ноды + случайный порт (30000-32767)
```

