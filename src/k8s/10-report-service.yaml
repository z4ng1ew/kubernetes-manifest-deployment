## 🔑 Ключевые моменты для защиты

### 📊 Роль report-service в архитектуре

```
booking-service ──[publish]──► RabbitMQ ──[consume]──► report-service ──► statistics_db
   (publisher)                  (брокер)                 (consumer)         (5432)
```

Сервис отвечает за:
- асинхронный приём событий о бронированиях из очереди
- агрегацию данных (статистика по отелям, периодам, пользователям)
- предоставление отчётов через REST API на порту 8086
- хранение статистики в `statistics_db`

---

### 🔄 Асинхронная архитектура — главная особенность

В отличие от других сервисов, report-service **получает данные не через HTTP**, а через брокер:

| Тип общения | Кто использует | Плюсы | Минусы |
|-------------|----------------|-------|--------|
| **Синхронный HTTP** | booking ↔ hotel, payment, loyalty | Простота, мгновенный ответ | Тесная связь, отказ одного ломает всё |
| **Асинхронный AMQP** | **booking → report** | Развязка, отказоустойчивость | Сложнее отлаживать, нет мгновенного ответа |

Почему именно для отчётов выбран асинхронный путь:
- Отчёт **не нужен прямо сейчас** — пользователь не ждёт ответа
- Если report-service упал — события **накопятся в очереди** и обработаются позже
- Booking-service **не тормозит** из-за медленной агрегации

---

### 🗄️ База `statistics_db`

Хранит агрегированные данные: количество бронирований по отелям, выручка по периодам, активность пользователей. Это **аналитические данные** — пишутся часто (каждое событие), читаются реже (запрос отчёта).

---

### 🔒 Почему ClusterIP

Report-service вызывается только изнутри:
- gateway → report (для получения отчётов)
- RabbitMQ → report (для приёма событий)

Наружу не выставляется — отчёты идут через gateway.

---

### 🐰 Парный с booking-service по конфигу RabbitMQ

У booking и report **одинаковые** RabbitMQ-переменные (`QUEUE_NAME`, `EXCHANGE`), но разные роли:

```
booking-service              report-service
─────────────────            ─────────────────
PUBLISHER                    CONSUMER
шлёт сообщения в exchange    читает из queue
```

Один и тот же exchange + один и тот же queue → их связывает **binding** (правило маршрутизации внутри RabbitMQ). Это и есть pub/sub-паттерн через брокер.

---

### ⚙️ Сводка зависимостей сервисов

| Сервис | PostgreSQL | RabbitMQ | Другие сервисы |
|--------|:---:|:---:|:---:|
| session | ✅ | ❌ | ❌ |
| hotel | ✅ | ❌ | ❌ |
| booking | ✅ | ✅ (publisher) | ✅ (hotel, payment, loyalty) |
| payment | ✅ | ❌ | ❌ |
| loyalty | ✅ | ❌ | ❌ |
| **report** | **✅** | **✅ (consumer)** | **❌** |
| gateway | ❌ | ❌ | ✅ (все) |

Report — единственный consumer RabbitMQ. Это делает его **изолированным**: ломается → события копятся в очереди → восстановили → обработали догоняющим темпом.

---

