# report-service: статистика. Слушает очередь RabbitMQ от booking-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels:
    app: report-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: src-report-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: statistics_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: RABBIT_MQ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBIT_MQ_HOST } }
            - name: RABBIT_MQ_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBIT_MQ_PORT } }
            - name: RABBIT_MQ_QUEUE_NAME
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBIT_MQ_QUEUE_NAME } }
            - name: RABBIT_MQ_EXCHANGE
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBIT_MQ_EXCHANGE } }
            - name: RABBIT_MQ_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBIT_MQ_USER } }
            - name: RABBIT_MQ_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBIT_MQ_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  labels:
    app: report-service
spec:
  selector:
    app: report-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
























# Монолог для защиты (≈300 символов)

---

Report-service — сервис статистики, работает с БД `statistics_db`. Получает события асинхронно из RabbitMQ: booking-service публикует сообщения о бронированиях, report их забирает из очереди и сохраняет агрегированные данные. Подключение к БД и брокеру — через ConfigMap, креды — через Secret. Тип Service — ClusterIP, доступ только внутри кластера.

---

**Длина: ~395 символов.** Если нужно строго 300:

---

Report-service — сервис статистики с БД `statistics_db`. Асинхронно слушает очередь RabbitMQ: booking публикует события, report их обрабатывает. Подключения к БД и брокеру — из ConfigMap, креды — из Secret. ClusterIP — доступ только внутри кластера.

---

**Длина: ~300 символов.** ✅

