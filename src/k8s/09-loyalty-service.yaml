# loyalty-service: программа лояльности (баллы/скидки).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
  labels:
    app: loyalty-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-service
  template:
    metadata:
      labels:
        app: loyalty-service
    spec:
      containers:
        - name: loyalty-service
          image: src-loyalty-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: balances_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
  labels:
    app: loyalty-service
spec:
  selector:
    app: loyalty-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP


















# Монолог для защиты (≈300 символов)

---

Loyalty-service — сервис программы лояльности: начисляет и списывает баллы, хранит балансы пользователей в БД `balances_db`. Контейнер слушает порт 8085, подключение к БД настраивается через ConfigMap, креды — через Secret. Тип Service — ClusterIP: сервис вызывается только из booking-service внутри кластера.

---

**Длина: ~315 символов.** ✅

---

# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                              # Версия API для Deployment'ов (стабильная)
kind: Deployment                                 # Тип объекта — Deployment (управляет подом loyalty-service)
metadata:                                        # Блок метаданных Deployment'а
  name: loyalty-service                          # Имя Deployment'а — также DNS-имя в кластере
  labels:                                        # Метки Deployment'а
    app: loyalty-service                         # Метка для идентификации
spec:                                            # Спецификация Deployment'а
  replicas: 1                                    # Одна реплика — по заданию
  selector:                                      # Селектор — какие поды считать "своими"
    matchLabels:                                 # Точное совпадение меток
      app: loyalty-service                       # Управлять подами с меткой app=loyalty-service
  template:                                      # Шаблон создаваемых подов
    metadata:                                    # Метаданные пода
      labels:                                    # Метки пода
        app: loyalty-service                     # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                        # Спецификация пода
      containers:                                # Список контейнеров в поде (один)
        - name: loyalty-service                  # Имя контейнера
          image: src-loyalty-service:latest      # Локальный Docker-образ сервиса лояльности
          imagePullPolicy: Never                 # Не качать из реестра — использовать локальный образ minikube
          ports:                                 # Порты, которые слушает контейнер
            - containerPort: 8085                # Порт сервиса (Spring Boot слушает 8085)
          env:                                   # Переменные окружения для контейнера
            - name: POSTGRES_HOST                # Хост БД
              valueFrom:                         # Значение из ConfigMap
                configMapKeyRef:
                  name: app-config               # Имя ConfigMap'а
                  key: POSTGRES_HOST             # → "postgres" (DNS-имя БД)
            - name: POSTGRES_PORT                # Порт БД
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT             # → "5432"
            - name: POSTGRES_DB                  # Имя БД для loyalty-service
              value: balances_db                 # Хардкод — БД балансов лояльности (создана через init.sql)
            - name: POSTGRES_USER                # Логин БД
              valueFrom:
                secretKeyRef:                    # Источник — Secret (чувствительные данные)
                  name: app-secrets
                  key: POSTGRES_USER             # Логин в base64
            - name: POSTGRES_PASSWORD            # Пароль БД
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD         # Пароль в base64
---                                              # Разделитель YAML-документов
apiVersion: v1                                   # Версия API для Service (core API → v1)
kind: Service                                    # Тип объекта — Service
metadata:                                        # Метаданные Service'а
  name: loyalty-service                          # Имя Service'а = DNS-имя в кластере
  labels:                                        # Метки Service'а
    app: loyalty-service                         # Метка для группировки
spec:                                            # Спецификация Service'а
  selector:                                      # Селектор — какие поды обслуживает
    app: loyalty-service                         # Все поды с меткой app=loyalty-service
  ports:                                         # Порты Service'а
    - port: 8085                                 # Порт самого Service'а внутри кластера
      targetPort: 8085                           # Порт контейнера, куда направляется трафик
  type: ClusterIP                                # ClusterIP — доступ только внутри кластера (наружу не выставляется)
```

