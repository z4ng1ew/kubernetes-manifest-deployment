## 🔑 Ключевые моменты для защиты

### 🎁 Роль loyalty-service в архитектуре

```
booking-service ──► loyalty-service ──► balances_db (PostgreSQL)
    (8083)              (8085)              (5432)
```

Сервис отвечает за:
- хранение балансов баллов пользователей
- начисление баллов после успешного бронирования
- списание баллов при использовании скидки
- учёт уровня лояльности (BRONZE / SILVER / GOLD)

Вызывается из booking-service в момент создания/отмены брони.

---

### 🗄️ База `balances_db`

Хранит финансово-учётные данные программы лояльности: ID пользователя, текущий баланс баллов, уровень лояльности, история начислений/списаний. Это **транзакционные данные** — каждая операция должна быть атомарной (нельзя списать одни баллы дважды).

---

### 🔒 Почему ClusterIP

Loyalty-service **не вызывается напрямую снаружи**:
- баллы — внутренняя бизнес-логика
- начисление инициируется только booking-service
- открытый порт = риск манипуляций с балансами

Доступ строго: gateway → booking → loyalty. Чем глубже сервис в архитектуре, тем меньше у него точек доступа.

---

### 📦 Минимум зависимостей

Как и payment-service, loyalty-service имеет только подключение к своей БД:
- Не работает с RabbitMQ
- Не вызывает другие сервисы напрямую
- Простая, изолированная зона ответственности

Это пример **хорошего микросервиса**: одна задача, одна БД, минимум связей.

---

### ⚙️ Сравнение с другими сервисами

| Сервис | Своя БД | RabbitMQ | Вызывает других | Тип Service |
|--------|---------|----------|-----------------|-------------|
| session | users_db | ❌ | ❌ | NodePort |
| hotel | hotels_db | ❌ | ❌ | ClusterIP |
| **loyalty** | **balances_db** | **❌** | **❌** | **ClusterIP** |
| payment | payments_db | ❌ | ❌ | ClusterIP |
| booking | reservations_db | ✅ | ✅ (3 сервиса) | ClusterIP |
| report | reports_db | ✅ | ❌ | ClusterIP |
| gateway | — | ❌ | ✅ (все) | NodePort |

Loyalty находится в группе **простых stateful-сервисов** — одна БД, одна задача.

