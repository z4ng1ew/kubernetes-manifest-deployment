# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                                      # Версия API для Deployment'ов (стабильная)
kind: Deployment                                         # Тип объекта — Deployment (управляет подом брокера)
metadata:                                                # Блок метаданных Deployment'а
  name: rabbitmq                                         # Имя Deployment'а — также DNS-имя для подключения
  labels:                                                # Метки Deployment'а
    app: rabbitmq                                        # Метка для идентификации
spec:                                                    # Спецификация Deployment'а
  replicas: 1                                            # Одна реплика (для кластера RabbitMQ нужна отдельная настройка с StatefulSet)
  selector:                                              # Селектор — какие поды считать "своими"
    matchLabels:                                         # Точное совпадение меток
      app: rabbitmq                                      # Управлять подами с меткой app=rabbitmq
  template:                                              # Шаблон создаваемых подов
    metadata:                                            # Метаданные пода
      labels:                                            # Метки пода
        app: rabbitmq                                    # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                                # Спецификация пода
      containers:                                        # Список контейнеров в поде
        - name: rabbitmq                                 # Имя контейнера
          image: rabbitmq:3.12-management-alpine         # Официальный образ RabbitMQ 3.12 + management-плагин (веб-UI), на Alpine (легче)
          imagePullPolicy: Never                         # Не качать из реестра — использовать локальный образ minikube
          ports:                                         # Порты, которые открывает контейнер
            - containerPort: 5672                        # AMQP-порт — основной протокол для отправки/получения сообщений
            - containerPort: 15672                       # HTTP-порт для веб-интерфейса управления (management UI)
          env:                                           # Переменные окружения для контейнера
            - name: RABBITMQ_DEFAULT_USER                # Стандартная переменная RabbitMQ — логин администратора
              valueFrom:                                 # Значение из внешнего источника
                secretKeyRef:                            # Источник — Secret
                  name: app-secrets                      # Имя Secret'а
                  key: RABBIT_MQ_USER                    # Ключ с логином (в base64 → "guest")
            - name: RABBITMQ_DEFAULT_PASS                # Стандартная переменная RabbitMQ — пароль администратора
              valueFrom:
                secretKeyRef:
                  name: app-secrets                      # Из того же Secret'а
                  key: RABBIT_MQ_PASSWORD                # Пароль в base64 → "guest"
---                                                      # Разделитель YAML-документов
apiVersion: v1                                           # Версия API для Service (core API → v1)
kind: Service                                            # Тип объекта — Service
metadata:                                                # Метаданные Service'а
  name: rabbitmq                                         # Имя Service'а = DNS-имя для подключения из других подов
  labels:                                                # Метки Service'а
    app: rabbitmq                                        # Метка для группировки
spec:                                                    # Спецификация Service'а
  selector:                                              # Селектор — какие поды обслуживает
    app: rabbitmq                                        # Все поды с меткой app=rabbitmq
  ports:                                                 # Список портов (у RabbitMQ их два — поэтому используем именованные)
    - name: amqp                                         # Имя порта — для AMQP-протокола (сообщения)
      port: 5672                                         # Порт Service'а
      targetPort: 5672                                   # Порт контейнера, куда перенаправляется трафик
    - name: management                                   # Имя порта — для веб-UI
      port: 15672                                        # Порт Service'а для management-интерфейса
      targetPort: 15672                                  # Порт контейнера для веб-UI
  type: ClusterIP                                        # ClusterIP — доступ только внутри кластера (брокер не открыт наружу)
```

