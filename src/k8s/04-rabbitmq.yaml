## 🔑 Ключевые моменты для защиты

### 🐰 Зачем нужен RabbitMQ в проекте

В микросервисной архитектуре есть два паттерна общения:
- **Синхронный (HTTP/REST)** — сервис ждёт ответа → блокировка, тесная связанность
- **Асинхронный (через брокер)** — сервис отправил сообщение и пошёл дальше → независимость, отказоустойчивость

В твоём приложении:
```
booking-service ──[publish event]──► RabbitMQ ──[consume]──► report-service
```
Бронирование не ждёт, пока сервис отчётов обработает данные — даже если report-service упал, события накопятся в очереди и обработаются позже.

---

### 🔌 Зачем нужны ДВА порта (5672 и 15672)

| Порт | Протокол | Назначение |
|------|----------|------------|
| **5672** | AMQP (бинарный) | По нему сервисы шлют/получают сообщения |
| **15672** | HTTP | Веб-интерфейс администратора (графики, очереди, пользователи) |

Когда портов несколько — в Service ОБЯЗАТЕЛЬНО нужно указывать `name` для каждого, иначе Kubernetes не примет манифест.

---

### 🎛️ Почему образ с `management`

| Образ | Состав |
|-------|--------|
| `rabbitmq:3.12-alpine` | Только брокер (без UI) |
| `rabbitmq:3.12-management-alpine` (этот) | Брокер + веб-интерфейс на 15672 |

Веб-UI полезен для отладки: можно зайти в браузер, увидеть очереди, exchanges, очередь сообщений в реальном времени. Чтобы попасть туда из своей машины, нужен туннель:
```bash
kubectl port-forward service/rabbitmq 15672:15672
# Открыть http://localhost:15672 (логин/пароль: guest/guest)
```

---

### 📨 Очередь и Exchange (из ConfigMap)

В ConfigMap у тебя были:
```yaml
RABBIT_MQ_QUEUE_NAME: booking_statistics_queue
RABBIT_MQ_EXCHANGE: booking_statistics_exchange
```

- **Exchange** — точка входа: куда отправляются сообщения от booking-service
- **Queue** — точка выхода: откуда читает report-service
- Между ними — **binding** (правило маршрутизации)

```
booking-service ──► [exchange] ──► [queue] ──► report-service
```

---

### 💾 Stateful или нет?

RabbitMQ хранит сообщения и состояние очередей **на диске** (если очереди durable). В этой конфигурации **volume не подключён** — при пересоздании пода все очереди и сообщения теряются. Для production:
- Подключить `PersistentVolumeClaim` к `/var/lib/rabbitmq`
- Использовать `StatefulSet` вместо `Deployment`
- Настроить кластер из нескольких нод RabbitMQ

Для учебного проекта одной реплики и in-memory очередей достаточно.

---

### 🔐 Стандартные креды `guest/guest`

В образе RabbitMQ по умолчанию работают `guest/guest`, но **только для localhost-подключений**. Если бы мы оставили дефолтные креды, наши сервисы (другие поды) не смогли бы подключиться. Поэтому через `RABBITMQ_DEFAULT_USER` и `RABBITMQ_DEFAULT_PASS` мы переопределяем юзера, разрешая ему подключаться отовсюду внутри кластера.