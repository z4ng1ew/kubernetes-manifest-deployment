# RabbitMQ — брокер сообщений между booking-service и report-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 5672    # AMQP — основной протокол сообщений
            - containerPort: 15672   # Web UI
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBIT_MQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBIT_MQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP













# Монолог для защиты (≈300 символов)

---

Это RabbitMQ — брокер сообщений между booking-service и report-service: бронирование отправляет событие в очередь, отчёты его обрабатывают асинхронно. Образ с `management` — есть веб-интерфейс на порту 15672, AMQP-протокол на 5672. Логин и пароль из Secret, ClusterIP-сервис делает брокер доступным внутри кластера по DNS-имени `rabbitmq`.

