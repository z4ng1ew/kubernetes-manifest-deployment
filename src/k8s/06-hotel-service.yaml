## 🔑 Ключевые моменты для защиты

### 🏨 Роль hotel-service в архитектуре

```
Postman ──► gateway-service ──► hotel-service ──► hotels_db (PostgreSQL)
              (8087)                (8082)              (5432)
```

Сервис отвечает за:
- хранение списка отелей (название, адрес, рейтинг, количество комнат)
- получение информации об отеле по ID
- проверку доступности номеров

Это **справочный** сервис — данные в основном читаются, а не модифицируются.

---

### 🔒 Почему ClusterIP, а не NodePort

Hotel-service **никогда не вызывается напрямую снаружи**. Все запросы идут через gateway:

```
Снаружи ─► gateway (NodePort 8087) ─► hotel-service (ClusterIP 8082)
```

Зачем такая схема:
- **Безопасность** — только одна точка входа (gateway), легче контролировать
- **Авторизация** — gateway проверяет токены перед пропуском запроса
- **Логирование** — все запросы проходят через одно место
- **Меньше открытых портов** наружу

ClusterIP — это поведение по умолчанию для Service: виртуальный IP, доступный только подам внутри кластера.

---

### 🗄️ База `hotels_db`

В образе `src-postgres:latest` встроен `init.sql`, который создаёт отдельные БД для каждого сервиса. Принцип **database per service**:

| Сервис | Своя БД |
|--------|---------|
| session-service | `users_db` |
| **hotel-service** | **`hotels_db`** |
| booking-service | `bookings_db` |
| payment-service | `payments_db` |
| loyalty-service | `balances_db` |
| report-service | `reports_db` |

Зачем так:
- Сервисы **независимы** — изменение схемы одной БД не ломает другие
- При масштабировании можно перенести БД сервиса на отдельный сервер
- Чёткое разделение ответственности

---

### 🌐 Подключение к БД из этого сервиса

При старте Spring Boot подставляет переменные окружения в JDBC-строку подключения:

```
jdbc:postgresql://postgres:5432/hotels_db
                     │       │      │
                     │       │      └─ POSTGRES_DB
                     │       └──────── POSTGRES_PORT (из ConfigMap)
                     └──────────────── POSTGRES_HOST (из ConfigMap)

Логин/пароль:    postgres / postgres
                     │          │
                     │          └─ POSTGRES_PASSWORD (из Secret)
                     └──────────── POSTGRES_USER (из Secret)
```

DNS-имя `postgres` резолвится в ClusterIP postgres-сервиса через CoreDNS, встроенный в Kubernetes.