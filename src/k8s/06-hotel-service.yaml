# hotel-service: справочник отелей.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  labels:
    app: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
        - name: hotel-service
          image: src-hotel-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: hotels_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  labels:
    app: hotel-service
spec:
  selector:
    app: hotel-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
















# Монолог для защиты (≈300 символов)

---

Hotel-service — справочник отелей, работает с БД `hotels_db`. Контейнер слушает порт 8082, конфигурация подключения к БД берётся из ConfigMap, креды — из Secret. Тип Service — ClusterIP, потому что сервис вызывается только изнутри кластера через gateway-service, наружу его выставлять не нужно.

---

**Длина: ~315 символов.** ✅

---

# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                              # Версия API для Deployment'ов (стабильная)
kind: Deployment                                 # Тип объекта — Deployment (управляет подом hotel-service)
metadata:                                        # Блок метаданных Deployment'а
  name: hotel-service                            # Имя Deployment'а — также DNS-имя для подключения других сервисов
  labels:                                        # Метки Deployment'а
    app: hotel-service                           # Метка для идентификации
spec:                                            # Спецификация Deployment'а
  replicas: 1                                    # Одна реплика — по заданию для всех сервисов одна
  selector:                                      # Селектор — какие поды считать "своими"
    matchLabels:                                 # Точное совпадение меток
      app: hotel-service                         # Управлять подами с меткой app=hotel-service
  template:                                      # Шаблон создаваемых подов
    metadata:                                    # Метаданные пода
      labels:                                    # Метки пода
        app: hotel-service                       # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                        # Спецификация пода
      containers:                                # Список контейнеров в поде (один)
        - name: hotel-service                    # Имя контейнера
          image: src-hotel-service:latest        # Локальный Docker-образ сервиса отелей
          imagePullPolicy: Never                 # Не качать из реестра — использовать локальный образ minikube
          ports:                                 # Порты, которые слушает контейнер
            - containerPort: 8082                # Порт сервиса (Spring Boot слушает 8082)
          env:                                   # Переменные окружения для контейнера
            - name: POSTGRES_HOST                # Хост БД
              valueFrom:                         # Значение из внешнего источника
                configMapKeyRef:                 # Источник — ConfigMap
                  name: app-config               # Имя ConfigMap'а
                  key: POSTGRES_HOST             # Ключ → "postgres" (DNS-имя БД в кластере)
            - name: POSTGRES_PORT                # Порт БД
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT             # Ключ → "5432"
            - name: POSTGRES_DB                  # Имя конкретной БД для этого сервиса
              value: hotels_db                   # Хардкод — БД отелей (создана через init.sql в postgres-образе)
            - name: POSTGRES_USER                # Логин БД
              valueFrom:
                secretKeyRef:                    # Источник — Secret (чувствительные данные)
                  name: app-secrets
                  key: POSTGRES_USER             # Ключ с логином в base64
            - name: POSTGRES_PASSWORD            # Пароль БД
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD         # Пароль в base64
---                                              # Разделитель YAML-документов
apiVersion: v1                                   # Версия API для Service (core API → v1)
kind: Service                                    # Тип объекта — Service (сетевая абстракция над подами)
metadata:                                        # Метаданные Service'а
  name: hotel-service                            # Имя Service'а = DNS-имя в кластере
  labels:                                        # Метки Service'а
    app: hotel-service                           # Метка для группировки
spec:                                            # Спецификация Service'а
  selector:                                      # Селектор — какие поды обслуживает
    app: hotel-service                           # Все поды с меткой app=hotel-service
  ports:                                         # Порты Service'а
    - port: 8082                                 # Порт самого Service'а (внутри кластера)
      targetPort: 8082                           # Порт контейнера, куда направляется трафик
  type: ClusterIP                                # ClusterIP — доступ только внутри кластера (наружу не выставляется)
```

