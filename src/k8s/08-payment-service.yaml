# payment-service: платежи.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: src-payment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: payments_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP












# Монолог для защиты (≈300 символов)

---

Payment-service — сервис платежей, работает с БД `payments_db`. Контейнер слушает порт 8084, подключение к БД настраивается через ConfigMap, креды — через Secret. Тип Service — ClusterIP: платежи вызываются только из booking-service внутри кластера, наружу не выставляются для безопасности.

---

**Длина: ~310 символов.** ✅

---

# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                              # Версия API для Deployment'ов (стабильная)
kind: Deployment                                 # Тип объекта — Deployment (управляет подом payment-service)
metadata:                                        # Блок метаданных Deployment'а
  name: payment-service                          # Имя Deployment'а — также DNS-имя в кластере
  labels:                                        # Метки Deployment'а
    app: payment-service                         # Метка для идентификации
spec:                                            # Спецификация Deployment'а
  replicas: 1                                    # Одна реплика — по заданию
  selector:                                      # Селектор — какие поды считать "своими"
    matchLabels:                                 # Точное совпадение меток
      app: payment-service                       # Управлять подами с меткой app=payment-service
  template:                                      # Шаблон создаваемых подов
    metadata:                                    # Метаданные пода
      labels:                                    # Метки пода
        app: payment-service                     # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                        # Спецификация пода
      containers:                                # Список контейнеров в поде (один)
        - name: payment-service                  # Имя контейнера
          image: src-payment-service:latest      # Локальный Docker-образ сервиса платежей
          imagePullPolicy: Never                 # Не качать из реестра — использовать локальный образ minikube
          ports:                                 # Порты, которые слушает контейнер
            - containerPort: 8084                # Порт сервиса (Spring Boot слушает 8084)
          env:                                   # Переменные окружения для контейнера
            - name: POSTGRES_HOST                # Хост БД
              valueFrom:                         # Значение из ConfigMap
                configMapKeyRef:
                  name: app-config               # Имя ConfigMap'а
                  key: POSTGRES_HOST             # → "postgres" (DNS-имя БД)
            - name: POSTGRES_PORT                # Порт БД
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT             # → "5432"
            - name: POSTGRES_DB                  # Имя БД для payment-service
              value: payments_db                 # Хардкод — БД платежей (создана через init.sql)
            - name: POSTGRES_USER                # Логин БД
              valueFrom:
                secretKeyRef:                    # Источник — Secret (чувствительные данные)
                  name: app-secrets
                  key: POSTGRES_USER             # Логин в base64
            - name: POSTGRES_PASSWORD            # Пароль БД
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD         # Пароль в base64
---                                              # Разделитель YAML-документов
apiVersion: v1                                   # Версия API для Service (core API → v1)
kind: Service                                    # Тип объекта — Service
metadata:                                        # Метаданные Service'а
  name: payment-service                          # Имя Service'а = DNS-имя в кластере
  labels:                                        # Метки Service'а
    app: payment-service                         # Метка для группировки
spec:                                            # Спецификация Service'а
  selector:                                      # Селектор — какие поды обслуживает
    app: payment-service                         # Все поды с меткой app=payment-service
  ports:                                         # Порты Service'а
    - port: 8084                                 # Порт самого Service'а внутри кластера
      targetPort: 8084                           # Порт контейнера, куда направляется трафик
  type: ClusterIP                                # ClusterIP — доступ только внутри кластера (наружу не выставляется)
```

