## 🔑 Ключевые моменты для защиты

### 💳 Роль payment-service в архитектуре

```
booking-service ──► payment-service ──► payments_db (PostgreSQL)
    (8083)              (8084)               (5432)
```

Сервис отвечает за:
- создание платежа при бронировании
- подтверждение/отклонение транзакции
- возвраты при отмене брони
- хранение истории платежей

Вызывается **только из booking-service** в момент бронирования.

---

### 🔒 Почему ClusterIP — особенно критично

Платёжный сервис **никогда не должен быть открыт наружу**:
- Платежи — самая чувствительная зона
- Открытый порт = потенциальный вектор атаки на финансовые операции
- Доступ ограничен gateway → booking → payment (несколько слоёв проверки)

Это правило безопасности: **минимум открытых наружу портов**.

---

### 🗄️ База `payments_db`

Хранит транзакционные данные платежей: ID платежа, ID брони, сумма, статус (PENDING/CONFIRMED/REFUNDED), время операции. Своя БД — потому что у payment-service строгие требования к консистентности (двойное списание недопустимо), и его данные не должны зависеть от изменений в других БД.

---

### 🔄 Транзакционная логика

```
booking создаёт бронь (статус PENDING)
        ↓
booking → payment.charge() [синхронно]
        ↓
payment списывает деньги в payments_db
        ↓
payment возвращает 200 OK
        ↓
booking обновляет бронь (статус CONFIRMED)
```

Если на любом шаге ошибка — booking откатывает бронь, payment откатывает списание. Это **distributed transaction** — одна из самых сложных тем в микросервисах. В учебном проекте упрощённо: payment либо подтверждает, либо отклоняет.

---

### 📦 Минимум переменных окружения

В отличие от booking-service (15+ переменных), у payment всего 5 — только подключение к БД. Это значит:
- Сервис **не вызывает других** напрямую
- Не работает с RabbitMQ
- Простая зона ответственности — только своя БД

Чем меньше зависимостей — тем меньше точек отказа.

