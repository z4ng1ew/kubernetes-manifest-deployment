# Secret — секреты (пароли, ключи). Значения в base64 (echo -n 'значение' | base64).
# Декодирование: kubectl get secret app-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # postgres — пароль вшит в твой Dockerfile postgres-образа
  POSTGRES_USER: cG9zdGdyZXM=
  # postgres
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  # guest — стандартный пользователь rabbitmq
  RABBIT_MQ_USER: Z3Vlc3Q=
  # guest
  RABBIT_MQ_PASSWORD: Z3Vlc3Q=
  # b51ceda2-bfa5-11eb-8529-0242ac130003 — UUID gateway-сервиса (межсервисная авторизация)
  GATEWAY_SERVICE_UUID: YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz
  # 911ccb4c-c055-11eb-8529-0242ac130003 — UUID booking-сервиса
  BOOKING_SERVICE_UUID: OTExY2NiNGMtYzA1NS0xMWViLTg1MjktMDI0MmFjMTMwMDAz
















# Монолог для защиты (≈300 символов)

---

Это Secret `app-secrets` — хранилище чувствительных данных: пароли Postgres и RabbitMQ, UUID-ключи для межсервисной авторизации. Значения хранятся в base64 — это не шифрование, а кодирование, поэтому Secret отличается от ConfigMap только семантикой и правами доступа. Тип `Opaque` — стандартный для произвольных пар ключ-значение.

---

**Длина: ~395 символов.** Если нужно строго 300:

---

Secret `app-secrets` — хранилище чувствительных данных: пароли Postgres, RabbitMQ и UUID-ключи межсервисной авторизации. Значения в base64 — это кодирование, а не шифрование. Тип `Opaque` — стандартный для произвольных секретов. Декодируется через `base64 --decode`.

---

**Длина: ~310 символов.** ✅

---

# YAML с построчными комментариями через `#`

```yaml
apiVersion: v1                                                                      # Версия API Kubernetes (Secret относится к core API → v1)
kind: Secret                                                                        # Тип объекта — Secret (хранилище чувствительных данных)
metadata:                                                                           # Блок метаданных объекта
  name: app-secrets                                                                 # Имя Secret'а — по нему обращаются Deployment'ы через secretKeyRef
type: Opaque                                                                        # Тип Secret'а — Opaque (универсальный, для произвольных пар ключ-значение)
data:                                                                               # Основной блок с данными (значения ОБЯЗАТЕЛЬНО в base64)
  # ---------- PostgreSQL ----------                                                # Раздел с креденшелами БД
  POSTGRES_USER: cG9zdGdyZXM=                                                       # Логин БД в base64 → декодируется в "postgres"
  POSTGRES_PASSWORD: cG9zdGdyZXM=                                                   # Пароль БД в base64 → декодируется в "postgres"

  # ---------- RabbitMQ ----------                                                  # Раздел с креденшелами брокера сообщений
  RABBIT_MQ_USER: Z3Vlc3Q=                                                          # Логин RabbitMQ в base64 → "guest" (стандартный пользователь)
  RABBIT_MQ_PASSWORD: Z3Vlc3Q=                                                      # Пароль RabbitMQ в base64 → "guest"

  # ---------- Межсервисная авторизация ----------                                  # UUID-ключи, по которым сервисы доверяют друг другу
  GATEWAY_SERVICE_UUID: YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz             # UUID gateway-сервиса в base64
  BOOKING_SERVICE_UUID: OTExY2NiNGMtYzA1NS0xMWViLTg1MjktMDI0MmFjMTMwMDAz             # UUID booking-сервиса в base64
```

