## 🔑 Ключевые моменты для защиты

### 📌 Чем Secret отличается от ConfigMap

| Параметр | ConfigMap | Secret |
|----------|-----------|--------|
| Назначение | Несекретные настройки | Пароли, ключи, токены |
| Формат данных | Plain text | base64-кодированные |
| Шифрование на диске | Нет | Опционально (etcd encryption) |
| Доступ через RBAC | Обычный | Можно ограничить отдельно |
| Монтирование | env, volume | env, volume |

⚠️ **Важно**: base64 — это **НЕ шифрование**, а просто кодирование. Любой, у кого есть доступ к Secret, легко получит исходное значение командой `base64 --decode`. Защита Secret'а строится через **RBAC** и **encryption at rest** в etcd.

---

### 🔐 Как получить значения в base64

```bash
echo -n 'postgres' | base64
# cG9zdGdyZXM=

echo -n 'guest' | base64
# Z3Vlc3Q=

echo -n 'b51ceda2-bfa5-11eb-8529-0242ac130003' | base64
# YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz
```

⚠️ Флаг `-n` обязателен — иначе echo добавит `\n` в конце, и base64 будет другой.

---

### 🔓 Как декодировать обратно (для пункта 4 отчёта)

```bash
# Конкретный ключ
kubectl get secret app-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode

# Все ключи разом
kubectl get secret app-secrets -o jsonpath='{.data}' | base64 --decode
```

---

### 🎯 Типы Secret в Kubernetes

| Тип | Назначение |
|-----|------------|
| **`Opaque`** (этот) | Универсальный — любые пары ключ-значение |
| `kubernetes.io/tls` | TLS-сертификаты (key + cert) |
| `kubernetes.io/dockerconfigjson` | Креды для приватных Docker-реестров |
| `kubernetes.io/service-account-token` | Токены ServiceAccount |
| `kubernetes.io/basic-auth` | Базовая HTTP-аутентификация |
| `kubernetes.io/ssh-auth` | SSH-ключи |

В твоём проекте `Opaque` — правильный выбор, так как хранишь произвольные значения.