## 🔑 Ключевые моменты для защиты

### 🌐 Booking-service — центральный узел архитектуры

```
                              ┌─► hotel-service     (проверка номера)
                              │
gateway-service ──► booking ──┼─► payment-service   (оплата)
                              │
                              ├─► loyalty-service   (бонусы)
                              │
                              └─► RabbitMQ ──► report-service (статистика)
```

Это **самый связанный** сервис: 4 синхронных HTTP-вызова + 1 асинхронный через брокер. Поэтому у него больше всего переменных окружения.

---

### 🔄 Синхронные vs асинхронные вызовы

| Вызов | Куда | Зачем | Тип |
|-------|------|-------|-----|
| `HOTEL_SERVICE_*` | hotel-service | проверить, есть ли свободный номер | синхронный HTTP |
| `PAYMENT_SERVICE_*` | payment-service | списать деньги | синхронный HTTP |
| `LOYALTY_SERVICE_*` | loyalty-service | начислить/списать баллы | синхронный HTTP |
| `RABBIT_MQ_*` | RabbitMQ | сообщить о бронировании для статистики | асинхронный AMQP |

**Зачем смешанная схема:**
- Проверка номера, оплата и бонусы должны произойти **прямо сейчас** (синхронно) — пользователь ждёт ответ
- Статистика для отчётов **может подождать** (асинхронно) — отправили в очередь и сразу ответили клиенту

---

### 🗄️ База `reservations_db`

Хранит сами бронирования: ID пользователя, ID отеля, даты заезда/выезда, статус (PAID/CANCELLED), сумму. Это **транзакционные данные**, которые меняются постоянно — в отличие от справочника hotel-service, где данные читаются чаще, чем пишутся.

---

### 🔒 Почему ClusterIP

Booking-service **не вызывается напрямую снаружи** — все запросы идут через gateway. Зачем gateway проверяет токен сессии, валидирует данные, а уже потом передаёт запрос booking-service. Это паттерн **API Gateway** — единая точка входа в микросервисную систему.

---

### ⚠️ Порядок поднятия подов

Booking-service зависит от 5 других сервисов (postgres, rabbitmq, hotel, payment, loyalty). Если они ещё не готовы — booking упадёт с ошибкой подключения. Kubernetes **не гарантирует** порядок запуска. Решения:

1. **Spring Boot retry** — приложение само пытается подключиться повторно (часто уже встроено)
2. **`initContainers`** — специальные контейнеры, которые ждут готовности зависимостей перед стартом основного
3. **Readiness probes** — Kubernetes не направляет трафик, пока под не готов

В учебном проекте обычно достаточно встроенных retry'ев Spring Boot — после нескольких попыток сервис всё равно подключится.