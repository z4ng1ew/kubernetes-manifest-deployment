# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                                  # Версия API для Deployment'ов (стабильная)
kind: Deployment                                     # Тип объекта — Deployment (управляет подом gateway-service)
metadata:                                            # Блок метаданных Deployment'а
  name: gateway-service                              # Имя Deployment'а — также DNS-имя в кластере
  labels:                                            # Метки Deployment'а
    app: gateway-service                             # Метка для идентификации
spec:                                                # Спецификация Deployment'а
  replicas: 1                                        # Одна реплика — по заданию
  selector:                                          # Селектор — какие поды считать "своими"
    matchLabels:                                     # Точное совпадение меток
      app: gateway-service                           # Управлять подами с меткой app=gateway-service
  template:                                          # Шаблон создаваемых подов
    metadata:                                        # Метаданные пода
      labels:                                        # Метки пода
        app: gateway-service                         # ОБЯЗАТЕЛЬНО совпадает с selector выше
    spec:                                            # Спецификация пода
      containers:                                    # Список контейнеров в поде (один)
        - name: gateway-service                      # Имя контейнера
          image: src-gateway-service:latest          # Локальный Docker-образ API Gateway
          imagePullPolicy: Never                     # Не качать из реестра — использовать локальный образ minikube
          ports:                                     # Порты, которые слушает контейнер
            - containerPort: 8087                    # Порт gateway (главная входная точка приложения)
          env:                                       # Переменные окружения — адреса всех сервисов, к которым проксирует
            - name: SESSION_SERVICE_HOST             # Хост сервиса сессий (для авторизации)
              valueFrom:
                configMapKeyRef:
                  name: app-config                   # Имя ConfigMap'а
                  key: SESSION_SERVICE_HOST          # → "session-service" (DNS-имя)
            - name: SESSION_SERVICE_PORT             # Порт session-service
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SESSION_SERVICE_PORT          # → "8081"
            - name: HOTEL_SERVICE_HOST               # Хост сервиса отелей
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOTEL_SERVICE_HOST            # → "hotel-service"
            - name: HOTEL_SERVICE_PORT               # Порт hotel-service
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOTEL_SERVICE_PORT            # → "8082"
            - name: BOOKING_SERVICE_HOST             # Хост сервиса бронирований
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_SERVICE_HOST          # → "booking-service"
            - name: BOOKING_SERVICE_PORT             # Порт booking-service
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_SERVICE_PORT          # → "8083"
            - name: LOYALTY_SERVICE_HOST             # Хост сервиса лояльности
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOYALTY_SERVICE_HOST          # → "loyalty-service"
            - name: LOYALTY_SERVICE_PORT             # Порт loyalty-service
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOYALTY_SERVICE_PORT          # → "8085"
            - name: REPORT_SERVICE_HOST              # Хост сервиса отчётов
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REPORT_SERVICE_HOST           # → "report-service"
            - name: REPORT_SERVICE_PORT              # Порт report-service
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REPORT_SERVICE_PORT           # → "8086"
---                                                  # Разделитель YAML-документов
apiVersion: v1                                       # Версия API для Service (core API → v1)
kind: Service                                        # Тип объекта — Service
metadata:                                            # Метаданные Service'а
  name: gateway-service                              # Имя Service'а = DNS-имя в кластере
  labels:                                            # Метки Service'а
    app: gateway-service                             # Метка для группировки
spec:                                                # Спецификация Service'а
  selector:                                          # Селектор — какие поды обслуживает
    app: gateway-service                             # Все поды с меткой app=gateway-service
  ports:                                             # Порты Service'а
    - port: 8087                                     # Порт самого Service'а внутри кластера
      targetPort: 8087                               # Порт контейнера, куда идёт трафик
  type: NodePort                                     # NodePort — выставляется НАРУЖУ кластера на случайный порт (30000-32767)
```

