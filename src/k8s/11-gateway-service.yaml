## 🔑 Ключевые моменты для защиты

### 🚪 Паттерн API Gateway

```
                                  ┌─► session-service  (8081)
                                  │
                                  ├─► hotel-service    (8082)
                                  │
Postman ──► gateway-service ──────┼─► booking-service  (8083)
            (NodePort 8087)       │
                                  ├─► loyalty-service  (8085)
                                  │
                                  └─► report-service   (8086)
```

Gateway-service — это **единая точка входа** в микросервисную систему. Все внешние запросы идут только через него. Это даёт:
- ✅ **Безопасность** — один наружный порт, легко контролировать
- ✅ **Авторизация** — gateway проверяет токен сессии перед пропуском
- ✅ **Маршрутизация** — клиент знает только адрес gateway, не нужно держать список всех сервисов
- ✅ **Логирование** — все запросы проходят через одно место
- ✅ **Rate limiting / CORS** — централизованная настройка

---

### 🌐 Почему именно NodePort

В задании (пункт 6) сказано: **«Прокинуть туннели для доступа к gateway service и session service»**. Чтобы Postman снаружи мог достучаться, нужен NodePort:

```bash
minikube service gateway-service
```

Команда откроет URL вида `http://127.0.0.1:XXXXX`, где XXXXX — случайный порт из диапазона 30000–32767. В твоём `kubectl get svc` это уже видно:

```
gateway-service   NodePort   10.105.174.71   <none>   8087:32003/TCP
                                                       │      │
                                                       │      └─ NodePort (наружный)
                                                       └──────── Service port (внутренний)
```

---

### 📦 Только ConfigMap, никакого Secret

В gateway-service нет ни одного Secret-значения. Почему:
- Сервис **не работает с БД** напрямую
- **Не подключается к RabbitMQ**
- **Не хранит пароли** — только проксирует запросы

Это самый "чистый" сервис в плане конфигурации — только адреса соседей.

---

### 🔗 Связи со всеми сервисами

Gateway знает адреса **5 из 6** микросервисов:

| Сервис | Зачем gateway его вызывает |
|--------|---------------------------|
| session-service | Авторизация/регистрация |
| hotel-service | Получение списка/деталей отелей |
| booking-service | Создание/отмена бронирования |
| loyalty-service | Запрос баланса баллов |
| report-service | Получение отчётов |

⚠️ **Не знает** про `payment-service` — оплата идёт **внутри** booking-service, наружу не выставляется. Это правильно: платёжная логика инкапсулирована глубоко в архитектуре.

---

### ⚙️ Сводка: какие сервисы какого типа

| Сервис | Тип Service | Почему |
|--------|-------------|--------|
| **gateway** | **NodePort** | Единственная точка входа снаружи |
| **session** | **NodePort** | По заданию нужен туннель для тестов |
| postgres | ClusterIP | БД не должна быть видна наружу |
| rabbitmq | ClusterIP | Брокер только для внутренних сервисов |
| hotel | ClusterIP | Вызывается только через gateway |
| booking | ClusterIP | Вызывается только через gateway |
| payment | ClusterIP | Платежи — самая чувствительная зона |
| loyalty | ClusterIP | Бизнес-логика баллов |
| report | ClusterIP | Отчёты доступны через gateway |

**Правило**: чем глубже сервис в архитектуре, тем строже его изоляция.

