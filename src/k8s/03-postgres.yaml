## 🔑 Ключевые моменты для защиты

### 🗄️ Почему `replicas: 1` для БД

PostgreSQL — это **stateful** приложение. Просто увеличить `replicas` нельзя — будет несколько независимых БД с разными данными. Для отказоустойчивости БД используют:
- **StatefulSet** вместо Deployment
- **Streaming replication** (master + standby)
- **Persistent Volumes** для хранения данных вне пода

В учебном проекте этого не требуется — одной реплики достаточно.

### 💾 Где хранятся данные

⚠️ **В этой конфигурации данные теряются при пересоздании пода** — нет `volumes`. Для production нужно добавить `PersistentVolumeClaim`:

```yaml
volumeMounts:
  - name: postgres-data
    mountPath: /var/lib/postgresql/data
volumes:
  - name: postgres-data
    persistentVolumeClaim:
      claimName: postgres-pvc
```

Но для проверки работы микросервисов и Postman-тестов это не критично.

### 🌐 Как сервисы подключаются к БД

Из любого пода в кластере:
```
jdbc:postgresql://postgres:5432/balances_db
```
Здесь:
- `postgres` — имя Service-объекта (резолвится через DNS Kubernetes)
- `5432` — порт Service'а
- `balances_db` — конкретная БД из тех, что создал init.sql

### 🔐 Почему ClusterIP, а не NodePort

БД **не должна быть доступна снаружи** — это базовое правило безопасности. К ней обращаются только внутренние сервисы кластера. Если бы мы поставили `NodePort`, БД оказалась бы открыта на IP ноды → потенциальная уязвимость.

### 📜 Что делает встроенный `init.sql`

При первом запуске Postgres автоматически выполняет скрипты из `/docker-entrypoint-initdb.d/`. В образе `src-postgres:latest` там лежит `init.sql`, который создаёт 6 баз:
- `sessions_db`
- `hotels_db`
- `bookings_db`
- `payments_db`
- `balances_db`
- `reports_db`

Каждый микросервис подключается к своей БД (по принципу **database per service**).