# YAML с построчными комментариями через `#`

```yaml
apiVersion: apps/v1                              # Версия API для Deployment'ов (стабильная)
kind: Deployment                                 # Тип объекта — Deployment (управляет подом БД и его жизненным циклом)
metadata:                                        # Блок метаданных Deployment'а
  name: postgres                                 # Имя Deployment'а — также используется как DNS-имя для подключения
  labels:                                        # Метки Deployment'а
    app: postgres                                # Метка для идентификации
spec:                                            # Спецификация Deployment'а
  replicas: 1                                    # Одна реплика БД (для нескольких реплик нужна репликация Postgres — это отдельная тема)
  selector:                                      # Селектор — какие поды считать "своими"
    matchLabels:                                 # Точное совпадение меток
      app: postgres                              # Управлять подами с меткой app=postgres
  template:                                      # Шаблон создаваемых подов
    metadata:                                    # Метаданные пода
      labels:                                    # Метки пода
        app: postgres                            # ОБЯЗАТЕЛЬНО совпадает с selector.matchLabels
    spec:                                        # Спецификация пода
      containers:                                # Список контейнеров в поде (один)
        - name: postgres                         # Имя контейнера внутри пода
          image: src-postgres:latest             # Локальный образ с встроенным init.sql (создаёт 6 БД для сервисов)
          imagePullPolicy: Never                 # НЕ качать из реестра — использовать локальный образ minikube
          ports:                                 # Порты контейнера
            - containerPort: 5432                # PostgreSQL слушает стандартный порт 5432
          env:                                   # Переменные окружения для контейнера
            - name: POSTGRES_USER                # Имя пользователя БД (Postgres использует при инициализации)
              valueFrom:                         # Значение из внешнего источника
                secretKeyRef:                    # Источник — Secret
                  name: app-secrets              # Имя Secret'а
                  key: POSTGRES_USER             # Ключ в Secret'е (в base64 → "postgres")
            - name: POSTGRES_PASSWORD            # Пароль пользователя БД
              valueFrom:
                secretKeyRef:
                  name: app-secrets              # Из того же Secret'а
                  key: POSTGRES_PASSWORD         # Пароль в base64
            - name: POSTGRES_DB                  # Имя БД по умолчанию (создаётся автоматически при первом запуске)
              value: postgres                    # Хардкод-значение — основная БД (остальные 6 создаёт init.sql)
---                                              # Разделитель YAML-документов (дальше — второй объект)
apiVersion: v1                                   # Версия API для Service (core API → v1)
kind: Service                                    # Тип объекта — Service (сетевая абстракция над подами)
metadata:                                        # Метаданные Service'а
  name: postgres                                 # Имя Service'а = DNS-имя для подключения из других подов
  labels:                                        # Метки Service'а
    app: postgres                                # Метка для группировки
spec:                                            # Спецификация Service'а
  selector:                                      # Селектор — какие поды обслуживает
    app: postgres                                # Все поды с меткой app=postgres
  ports:                                         # Порты, которые открывает Service
    - port: 5432                                 # Порт самого Service'а (на нём слушает виртуальный IP)
      targetPort: 5432                           # Порт контейнера в поде, куда перенаправляется трафик
  type: ClusterIP                                # ClusterIP — доступ только внутри кластера (БД не открыта наружу — безопаснее)
```

